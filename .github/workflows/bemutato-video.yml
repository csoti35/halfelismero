name: Bemutató videó

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["video/**", ".github/workflows/bemutato-video.yml"]

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Eszközök
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji fonts-inter > /dev/null || sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji > /dev/null
          pip install -q edge-tts
          cd video && npm init -y > /dev/null && npm i -s playwright@1.48.2 && npx playwright install --with-deps chromium > /dev/null
      - name: Képkockák
        run: cd video && node shoot.js
      - name: Hang és videó
        run: python3 video/make.py
      - name: Feltöltés kiadásként
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete bemutato-video -y --cleanup-tag || true
          gh release create bemutato-video video/out/AquaFaj_bemutato.mp4 -t "AquaFaj bemutató videó" -n "Magyar nyelvű bemutató: mit tud az app, és hogyan telepítsd a telefonodra."
      - uses: actions/upload-artifact@v4
        with:
          name: bemutato
          path: video/out/AquaFaj_bemutato.mp4
