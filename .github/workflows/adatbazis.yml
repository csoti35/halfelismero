name: Fajadatbázis bővítése

on:
  schedule:
    # Éjszaka többször (UTC 0:15, 2:15, 4:15). A GitHub időzítője órákat késhet, ezért a futás
    # magától kihagyja magát, ha már a Gemini napi keretének újraindulása (UTC kb. 7-8 óra) után indulna,
    # így soha nem veszi el a napközbeni fotós felismerés elől a keretet.
    - cron: "15 0 * * *"
    - cron: "15 2 * * *"
    - cron: "15 4 * * *"
    # Napközben csak a külön adatbázis-kulccsal (a felismerés keretét nem érinti)
    - cron: "15 10 * * *"
    - cron: "15 14 * * *"
    - cron: "15 19 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**"]

permissions:
  contents: write

concurrency:
  group: adatbazis
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Időablak ellenőrzése
        id: ablak
        run: |
          h=$(date -u +%H)
          if [ "$h" -ge 6 ]; then
            echo "::notice::Nappali futás (UTC $h óra): csak az adatbázis-kulcs dolgozik, a felismerés kerete érintetlen."
            echo "main=0" >> $GITHUB_OUTPUT
          else
            echo "main=1" >> $GITHUB_OUTPUT
          fi
      - name: Adatlapok generálása
        env:
          USE_MAIN: ${{ steps.ablak.outputs.main }}
        run: python3 scripts/fajlista_json.py && python3 scripts/generate.py
      - name: Mentés
        run: |
          git config user.name "csoti35"
          git config user.email "djcsoti@gmail.com"
          git add data
          if git diff --cached --quiet; then echo "Nincs új adat."; exit 0; fi
          git commit -m "Fajadatbázis: új adatlapok ($(date +%F' '%H:%M))"
          git pull --rebase origin main
          git push origin main
