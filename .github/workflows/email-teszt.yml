name: E-mail teszt

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/email-teszt.yml"]

jobs:
  send:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Tesztbejelentés küldése a freemailre
        run: |
          code=$(curl -sS -o resp.html -w "%{http_code}" -L -X POST "https://formsubmit.co/aquafajpro@freemail.hu" \
            -H "Referer: https://csoti35.github.io/halfelismero/zsebkonyv/" \
            -H "Origin: https://csoti35.github.io" \
            -F "_subject=AquaFaj – Teszt bejelentés (fotóval)" \
            -F "_captcha=false" -F "_template=box" \
            -F "Bejelentés=Ez egy teszt az AquaFaj hibabejelentőből. Ha ezt látod, működik!" \
            -F "Típus=Teszt" \
            -F "attachment=@icons/icon-192.png;type=image/png")
          echo "HTTP $code"
          grep -oiE "activat[^<]{0,120}|success[^<]{0,80}|confirm[^<]{0,120}" resp.html | head -5 || true
          echo "::notice::FormSubmit válasz: HTTP $code $(grep -oiE 'activat[^<]{0,80}|confirm[^<]{0,80}' resp.html | head -1)"
