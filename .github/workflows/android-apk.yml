name: Android APK

on:
  push:
    branches: [android]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK licencek
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Groq kulcs ellenőrzése (egyszeri)
        continue-on-error: true
        run: |
          python3 - <<'EOF'
          import json, re, urllib.request, urllib.error
          s = open("app/src/main/java/com/example/data/local/ApiKeyStore.kt").read()
          m = re.search(r"groqCode = intArrayOf\(([^)]*)\)", s).group(1)
          key = "".join(chr(int(x) ^ 0x3C) for x in m.split(","))
          print("::add-mask::" + key)
          H = {"Authorization": "Bearer " + key, "Content-Type": "application/json", "User-Agent": "halfelismero-ci"}
          try:
              d = json.load(urllib.request.urlopen(urllib.request.Request("https://api.groq.com/openai/v1/models", headers=H), timeout=60))
              ids = sorted(x["id"] for x in d.get("data", []))
              print("::warning::GROQ modellek: " + " ".join(ids)[:900])
          except urllib.error.HTTPError as e:
              print("::warning::GROQ modellek HTTP %s %s" % (e.code, e.read().decode()[:300]))
          for model in ["qwen/qwen3.6-27b", "meta-llama/llama-4-scout-17b-16e-instruct"]:
              body = json.dumps({"model": model, "messages": [{"role": "user", "content": "Mondd: szia"}], "max_completion_tokens": 200}).encode()
              try:
                  d = json.load(urllib.request.urlopen(urllib.request.Request("https://api.groq.com/openai/v1/chat/completions", data=body, headers=H), timeout=60))
                  print("::warning::GROQ %s OK: %s" % (model, d["choices"][0]["message"]["content"][-120:].replace("\n", " ")))
              except urllib.error.HTTPError as e:
                  print("::warning::GROQ %s HTTP %s %s" % (model, e.code, e.read().decode()[:300].replace("\n", " ")))
          EOF

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: APK fordítása
        run: |
          set -o pipefail
          gradle assembleDebug --no-configuration-cache --console=plain 2>&1 | tee build.log || {
            grep -v "> Task" build.log | grep -E -A6 "^e: |error:|What went wrong|Could not|FAILED|Exception" | head -60 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
            exit 1
          }

      - name: APK átnevezése
        run: cp app/build/outputs/apk/debug/app-debug.apk halfelismero.apk

      - name: Közzététel letöltésre
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Halfelismerő – Android APK
          make_latest: true
          files: halfelismero.apk
          body: |
            Akváriumi Halfelismerő Android-alkalmazás.
            Letöltés: halfelismero.apk (lent, az Assets alatt).
            Telepítés után a Beállítások fülön add meg a saját ingyenes Gemini kulcsodat (aistudio.google.com/apikey).
