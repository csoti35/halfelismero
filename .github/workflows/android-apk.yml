name: Android APK

on:
  push:
    branches: [android]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK licencek
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Felismerés-teszt
        continue-on-error: true
        run: python3 .ci/test.py

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: APK fordítása
        run: |
          set -o pipefail
          gradle assembleDebug --no-configuration-cache --console=plain 2>&1 | tee build.log || {
            grep -v "> Task" build.log | grep -E -A6 "^e: |error:|What went wrong|Could not|FAILED|Exception" | head -60 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
            exit 1
          }

      - name: APK átnevezése
        run: cp app/build/outputs/apk/debug/app-debug.apk halfelismero.apk

      - name: Közzététel letöltésre
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Halfelismerő – Android APK
          make_latest: true
          files: halfelismero.apk
          body: |
            Akváriumi Halfelismerő Android-alkalmazás.
            Letöltés: halfelismero.apk (lent, az Assets alatt).
            Telepítés után a Beállítások fülön add meg a saját ingyenes Gemini kulcsodat (aistudio.google.com/apikey).
