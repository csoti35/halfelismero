name: Android APK

on:
  push:
    branches: [android]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: APK fordítása
        run: gradle assembleDebug --no-configuration-cache --stacktrace

      - name: APK átnevezése
        run: cp app/build/outputs/apk/debug/app-debug.apk halfelismero.apk

      - name: Közzététel letöltésre
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Halfelismerő – Android APK
          make_latest: true
          files: halfelismero.apk
          body: |
            Akváriumi Halfelismerő Android-alkalmazás.
            Letöltés: halfelismero.apk (lent, az Assets alatt).
            Telepítés után a Beállítások fülön add meg a saját ingyenes Gemini kulcsodat (aistudio.google.com/apikey).
